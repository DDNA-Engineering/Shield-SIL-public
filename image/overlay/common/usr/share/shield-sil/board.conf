# Shield v1.5 board interfaces presented to the guest by shield-board.
# Names match the Shield device tree (LED labels, gpio-line-names).

# Front-panel LEDs, /sys/class/leds/<name>.
LEDS="Heartbeat System User WAN WiFi ETH Battery"

# GPIO lines, in gpio-sim line order: <name>=<in|out>:<initial level>.
# out: driven by the guest, reported to the host model.
# in:  driven by the host model (gpio_in record), read by the guest.
GPIO_LINES="
shield:cell:sim-select=out:0
shield:cell:full-card-power=out:1
shield:wifi:wake=out:1
shield:wifi:enabled=out:1
shield:pgood:5v-out-efuse=in:1
shield:pgood:dc-efuse=in:1
shield:pgood:batt-efuse=in:1
shield:pgood:3v3-out-efuse=in:1
"

# The i.MX 8M Plus machine (QEMU imx8mp-evk with the SIL device tree): the
# LEDs (gpio-leds), named GPIOs (SoC gpio4), button (gpio-keys) and I2C buses
# (i2c-imx) are the SoC's own, so shield-board has nothing to present, and the
# hardware bus runs on UART1 (state) and UART3 (commands).
soc_board() {
	[ -r /proc/device-tree/compatible ] &&
		tr '\000' '\n' < /proc/device-tree/compatible | grep -qx 'ddna,shield-sil'
}
SOC_HW_STATE_TTY=/dev/ttymxc0
SOC_HW_CMD_TTY=/dev/ttymxc2

# The EM7595's USB device in sysfs, where it arrives over USB/IP. On virt the
# I2C adapters and the button come first and vhci_hcd is the only USB host
# (bus 1), so the modem is port 4. On the i.MX 8M Plus machine the modem is the
# only USB/IP device (port 1) and the SoC's xHCI registers buses 1 and 2 first,
# so vhci_hcd's high-speed root hub is bus 3.
modem_usb_dev() {
	if soc_board; then
		echo /sys/devices/platform/vhci_hcd.0/usb3/3-1
	else
		echo /sys/devices/platform/vhci_hcd.0/usb1/1-4
	fi
}

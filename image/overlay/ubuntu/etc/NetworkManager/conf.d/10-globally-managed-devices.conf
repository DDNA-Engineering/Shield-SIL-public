# Shield SIL: NetworkManager manages every interface (Ubuntu Server's default
# leaves Ethernet to netplan). Left alone: the Wi-Fi AP, which hostapd runs and
# bridges into br-lan (shield-wifi-ap.service), and the simulated Wi-Fi
# client's radio, which shield-wifi-client moves into its own namespace.
[keyfile]
unmanaged-devices=interface-name:mwiphy0-ap0;mac:02:00:00:00:01:00;interface-name:wlan1

# Wi-Fi in the SIL: the Shield AP and a simulated Wi-Fi client that joins it.
# Shield's radio is a MAYA-W260 (NXP IW611, 1x1); the SIL uses the kernel's
# simulated radios (mac80211_hwsim) with the standard Linux Wi-Fi stack.
# SSID, key and channel are SIL defaults, not values read from a Shield.
WIFI_SSID="Shield"
WIFI_KEY="shield-sil-wifi"
WIFI_BAND="2g"
WIFI_CHANNEL="6"
WIFI_HTMODE="HE20"
WIFI_COUNTRY="US"
# AP interface name on Shield (moal driver); also the WiFi LED's netdev.
WIFI_AP_IFNAME="mwiphy0-ap0"
# Simulated client: second simulated radio, in its own network namespace.
WIFI_CLIENT_NETNS="wificlient"
WIFI_CLIENT_PHY_PATH="/sys/devices/virtual/mac80211_hwsim/hwsim1"

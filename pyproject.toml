[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-sil"
version = "1.0.0"
description = "Full-system software-in-the-loop simulation environment for the Kform Shield router"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shield-sil = "shield_sil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "system: boots the emulated Shield (needs root, QEMU and a built image)",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Errors and pyflakes only: real bugs (undefined names, unused imports), not style.
select = ["E9", "F"]
